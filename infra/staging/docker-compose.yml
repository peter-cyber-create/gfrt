# Isolated local staging stack — does NOT deploy to musooka.site.
# URL: https://127.0.0.1:8443 (temporary staging hostname/IP)
name: musooka-staging

services:
  db:
    image: postgres:16-alpine
    container_name: musooka-staging-db
    restart: unless-stopped
    networks: [musooka_staging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:-musooka_staging}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?POSTGRES_APP_PASSWORD required}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - staging_pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-musooka_staging}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: musooka-staging-mailpit
    restart: unless-stopped
    networks: [musooka_staging]
    ports:
      - "127.0.0.1:8025:8025"
    expose:
      - "1025"

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile.staging
    container_name: musooka-staging-api
    restart: unless-stopped
    networks: [musooka_staging]
    env_file: .env
    environment:
      NODE_ENV: staging
      PORT: 4000
      COOKIE_SECURE: "false"
      EMAIL_PROVIDER: smtp
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: staging@musooka.local
      # localhost + 127.0.0.1 — browsers treat them as different origins.
      CORS_ORIGIN: http://127.0.0.1:8088,http://localhost:8088,https://127.0.0.1:8443,https://localhost:8443
      PASSWORD_RESET_URL_BASE: http://127.0.0.1:8088/password/reset/confirm
      STORAGE_ROOT: /app/data/uploads
      DATABASE_URL: postgresql://musooka_app:${POSTGRES_APP_PASSWORD}@db:5432/${POSTGRES_DB:-musooka_staging}?schema=public
      MIGRATE_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-musooka_staging}?schema=public
      POSTGRES_DB: ${POSTGRES_DB:-musooka_staging}
      STAGING_SEED_PASSWORD: ${STAGING_SEED_PASSWORD:-demo1234}
      STAGING_ALLOW_PRESENTATION_RESET: "true"
      STAGING_SEED_REQUISITIONS: ${STAGING_SEED_REQUISITIONS:-180}
      AUTH_RATE_LIMIT_MAX: "200"
      RATE_LIMIT_MAX: "1000"
    volumes:
      - staging_uploads:/app/data/uploads
      - ./api-entrypoint.sh:/app/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/app/entrypoint.sh"]
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 180s

  web:
    build:
      context: ../../clone
      args:
        VITE_DEMO_MODE: "false"
        VITE_DATA_SOURCE: api
        # Same-origin API via nginx proxy — works for localhost and 127.0.0.1
        VITE_API_BASE_URL: ""
        VITE_STAGING_QUICK_LOGIN: "true"
        VITE_STAGING_DEMO_PASSWORD: ${STAGING_SEED_PASSWORD:-demo1234}
        VITE_STAGING_PRESENTATION_RESET: "true"
    container_name: musooka-staging-web
    restart: unless-stopped
    networks: [musooka_staging]
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  proxy:
    image: nginx:1.27-alpine
    container_name: musooka-staging-proxy
    restart: unless-stopped
    networks: [musooka_staging]
    ports:
      - "8088:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: musooka-staging-blackbox
    restart: unless-stopped
    networks: [musooka_staging]
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    expose:
      - "9115"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: musooka-staging-prometheus
    restart: unless-stopped
    networks: [musooka_staging]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    depends_on:
      - blackbox

networks:
  musooka_staging:
    name: musooka_staging

volumes:
  staging_pgdata:
  staging_uploads:
