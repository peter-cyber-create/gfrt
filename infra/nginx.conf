# Sample reverse-proxy layout for staging (do not point at musooka.site).
# Internet → Nginx → frontend static + /api → backend → PostgreSQL

upstream musooka_api {
  server api:4000;
  keepalive 16;
}

# HTTP → HTTPS redirect (enable when TLS certs are mounted)
server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name _;

  # ssl_certificate     /etc/nginx/certs/fullchain.pem;
  # ssl_certificate_key /etc/nginx/certs/privkey.pem;

  client_max_body_size 6m;
  client_body_timeout 30s;
  client_header_timeout 30s;
  send_timeout 60s;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # Strict-Transport-Security — enable only after HTTPS is verified end-to-end
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://musooka_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://musooka_api/health;
  }

  location /ready {
    proxy_pass http://musooka_api/ready;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
