# Optional HTTP-only proxy for local/lab staging without TLS.
# Prefer infra/nginx.conf (HTTPS) for real staging.

upstream musooka_api {
  server api:4000;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 6m;
  client_body_timeout 30s;
  client_header_timeout 30s;
  send_timeout 60s;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  location /api/ {
    proxy_pass http://musooka_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /health {
    proxy_pass http://musooka_api/health;
  }

  location /ready {
    proxy_pass http://musooka_api/ready;
  }

  location /assets/ {
    root /usr/share/nginx/html;
    expires 7d;
    add_header Cache-Control "public";
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
